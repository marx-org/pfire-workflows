name: Dependabot automation

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  pull-requests: read
  checks: read

jobs:
  dependabot:
    uses: ./.github/workflows/dependabot-automerge.yml
    secrets: inherit
    permissions:
      contents: write
      pull-requests: write
      checks: read
